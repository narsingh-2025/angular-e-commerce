<div class="page">
  <div class="page-header">
    <h2>{{ isEdit ? 'Edit' : 'New' }} Farmer</h2>
    <a routerLink="/dashboard/farmers" class="btn-back">← Back</a>
  </div>
  <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">
    <div class="form-grid-2">
      <div class="fg"><label>Farmer Name *</label><input formControlName="name" placeholder="Full name" /></div>
      <div class="fg"><label>Farm Name *</label><input formControlName="farmName" placeholder="e.g. Patidar Organic Farm" /></div>
      <div class="fg"><label>Phone *</label><input formControlName="phone" type="tel" /></div>
      <div class="fg"><label>Email</label><input formControlName="email" type="email" /></div>
      <div class="fg"><label>Location *</label><input formControlName="location" placeholder="City, State" /></div>
      <div class="fg"><label>State</label><input formControlName="state" /></div>
      <div class="fg"><label>Years Active</label><input formControlName="yearsActive" type="number" min="1" /></div>
    </div>
    <div class="fg"><label>Description</label><textarea formControlName="description" rows="3" placeholder="Farm story..."></textarea></div>
    <div class="fg"><label>Specialities (comma-separated)</label><input formControlName="specialities" placeholder="Organic Rice, Wheat, Vegetables" /></div>
    <div class="fg"><label>Certifications (comma-separated)</label><input formControlName="certifications" placeholder="FSSAI, Organic India" /></div>
    <div class="fg"><label>Cover Color</label>
      <div class="color-row">
        <div *ngFor="let c of colorOptions" class="color-dot" [style.background]="c" [class.selected]="form.get('coverColor')?.value === c" (click)="form.get('coverColor')!.setValue(c)"></div>
      </div>
    </div>
    <div class="toggle-row"><span>Is Organic</span><label class="toggle"><input formControlName="isOrganic" type="checkbox" /><span class="slider"></span></label></div>
    <div class="toggle-row"><span>Verified</span><label class="toggle"><input formControlName="isVerified" type="checkbox" /><span class="slider"></span></label></div>
    <div class="toggle-row"><span>Active</span><label class="toggle"><input formControlName="isActive" type="checkbox" /><span class="slider"></span></label></div>
    <div *ngIf="error" class="alert-err">{{ error }}</div>
    <div class="form-actions">
      <button type="submit" class="btn-save" [disabled]="loading">{{ loading ? 'Saving...' : (isEdit ? 'Update' : 'Create Farmer') }}</button>
      <a routerLink="/dashboard/farmers" class="btn-cancel">Cancel</a>
    </div>
  </form>
</div>
