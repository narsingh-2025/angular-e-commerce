<div class="page">
  <div class="page-header">
    <div><h2>Farmers</h2><p>Manage verified farmers on the platform</p></div>
    <a routerLink="/dashboard/farmers/new" class="btn-add">+ Add Farmer</a>
  </div>
  <div *ngIf="loading" class="loading">Loading...</div>
  <table class="data-table" *ngIf="!loading">
    <thead><tr><th>Farmer</th><th>Farm Name</th><th>Location</th><th>Specialities</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>
      <tr *ngFor="let f of farmers">
        <td>
          <div class="farmer-cell">
            <div class="f-avatar" [style.background]="f.coverColor || '#10b981'">{{ initials(f.name) }}</div>
            <div><strong>{{ f.name }}</strong><div class="sub-text">{{ f.phone }}</div></div>
          </div>
        </td>
        <td>{{ f.farmName }}</td>
        <td>{{ f.location }}</td>
        <td>
          <div class="spec-chips">
            <span *ngFor="let s of (f.specialities || []).slice(0,2)" class="spec">{{ s }}</span>
          </div>
        </td>
        <td>
          <span class="v-badge" *ngIf="f.isVerified">✓ Verified</span>
          <span class="org-badge" *ngIf="f.isOrganic">🌿 Organic</span>
          <span class="na" *ngIf="!f.isVerified && !f.isOrganic">—</span>
        </td>
        <td>
          <div class="actions">
            <a [routerLink]="['/dashboard/farmers/edit', f._id]" class="btn-edit">Edit</a>
            <a [routerLink]="['/farmers', f._id]" target="_blank" class="btn-view">View</a>
            <button (click)="delete(f._id!)" class="btn-del">Del</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
