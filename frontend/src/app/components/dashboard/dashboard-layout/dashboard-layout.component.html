<div class="dash-shell">
  <aside class="dash-sidebar">
    <div class="dash-brand">
      <span>⚡</span> Admin Panel
    </div>
    <nav class="dash-nav">
      <a *ngFor="let n of navItems"
         [routerLink]="n.route"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: n.route === '/dashboard'}"
         class="dash-nav-item">
        <span class="nav-icon">{{ n.icon }}</span>
        {{ n.label }}
      </a>
    </nav>
    <div class="dash-sidebar-footer">
      <a routerLink="/" class="dash-nav-item"><span class="nav-icon">🏠</span> View Site</a>
      <a routerLink="/shop" class="dash-nav-item"><span class="nav-icon">🛒</span> Shop</a>
    </div>
  </aside>

  <div class="dash-content">
    <header class="dash-header">
      <div class="dash-header-left">
        <h2>Dashboard</h2>
      </div>
      <div class="dash-header-right">
        <a routerLink="/bulk-order" class="header-btn">+ New Inquiry</a>
      </div>
    </header>
    <main class="dash-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
